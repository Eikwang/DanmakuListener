[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danmaku-listener"
version = "0.3.0"
description = "六平台弹幕监听系统（协议直连+统一消息契约+Web 测试控制台，可独立分发）"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DanmakuListener contributors" }]
dependencies = [
    "aiohttp>=3.8.0",
    "aiohttp-cors>=0.7.0",
    "websockets>=14.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.0",
    "protobuf>=7.35.1,<8",
    "quickjs>=1.19.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "qrcode>=7.0",
    "tomlkit>=0.12.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Chat",
]

[project.optional-dependencies]
douyin = []  # 原生 Web WS 直连（quickjs/protobuf 已入主依赖）
wechat = ["playwright>=1.30.0"]
all = ["playwright>=1.30.0"]

[project.scripts]
danmaku-listen = "danmaku_listener.__main__:main"
danmaku-serve = "danmaku_listener.__main__:main"

[tool.setuptools.packages.find]
include = ["danmaku_listener*"]

[tool.setuptools.package-data]
"danmaku_listener.web" = ["static/*", "blocked_keywords.json"]
"danmaku_listener.engines.protocol.douyin_assets" = ["*.js", "*.proto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
