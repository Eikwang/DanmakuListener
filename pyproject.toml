[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danmaku-listener"
version = "0.2.0"
description = "六平台弹幕监听引擎层（AUTOlive 监听底座）"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
danmaku-listen = "danmaku_listener.__main__:main"
danmaku-serve = "danmaku_listener.__main__:main"

[tool.setuptools.packages.find]
include = ["danmaku_listener*"]
